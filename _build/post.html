<!doctype html>
<!--
  The page every blog post is poured into. build.mjs fills in the marks in double braces.
  plain-site: no CSS.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{title}} | James Wiles</title>
<meta name="description" content="{{description}}">
<meta name="author" content="James K. Wiles">
<meta name="color-scheme" content="light dark">
<link rel="canonical" href="{{url}}">
<link rel="alternate" type="text/markdown" href="{{source}}">
<link rel="icon" href="/favicon.ico">

<meta property="og:site_name" content="James Wiles">
<meta property="og:locale" content="en_GB">
<meta property="og:type" content="article">
<meta property="og:title" content="{{title}}">
<meta property="og:description" content="{{description}}">
<meta property="og:url" content="{{url}}">
<meta property="og:image" content="{{image}}">
<meta property="og:image:width" content="{{imageWidth}}">
<meta property="og:image:height" content="{{imageHeight}}">
<meta property="og:image:alt" content="{{imageAlt}}">
<meta property="article:published_time" content="{{date}}">

<script data-goatcounter="https://jameswiles.goatcounter.com/count" async src="//gc.zgo.at/count.js"></script>
</head>
<body>

<table width="100%" cellpadding="0" cellspacing="0" role="presentation"><tr><td></td><td width="720">

<header>
<nav><a href="/">James Wiles</a> › <a href="/#blog">blog posts</a></nav>

<hr>
</header>

<article>
{{content}}
</article>

<footer>
<hr>

<p><small><a href="{{source}}">source</a> ・ visitors: <span id="visitors">…</span> ・ ▲ <a href="#">top</a></small></p>
</footer>

</td><td></td></tr></table>

<script type="module">
const url = `https://jameswiles.goatcounter.com/counter/${encodeURIComponent(location.pathname)}.json`
document.getElementById('visitors').textContent = await fetch(url).then(r => r.json()).then(d => d.count, () => 'unavailable')
</script>

</body>
</html>
